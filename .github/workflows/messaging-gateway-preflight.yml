name: Messaging Gateway Preflight

# Secret-free contract coverage for messaging trust-boundary validation. Trusted
# deployment workflows and service startup validate their own environment values.
on:
  push:
    branches: [main, develop]
    paths:
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.mjs"
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.test.mjs"
      - "packages/cloud/services/gateway-webhook/src/internal-auth.ts"
      - "packages/cloud/services/gateway-webhook/src/index.ts"
      - "packages/cloud/services/gateway-webhook/__tests__/internal-auth.test.ts"
      - "packages/cloud/services/gateway-webhook/railway.toml"
      - ".github/workflows/cloud-cf-deploy.yml"
      - ".github/workflows/messaging-gateway-preflight.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.mjs"
      - "packages/cloud/shared/scripts/messaging-gateway-preflight.test.mjs"
      - "packages/cloud/services/gateway-webhook/src/internal-auth.ts"
      - "packages/cloud/services/gateway-webhook/src/index.ts"
      - "packages/cloud/services/gateway-webhook/__tests__/internal-auth.test.ts"
      - "packages/cloud/services/gateway-webhook/railway.toml"
      - ".github/workflows/cloud-cf-deploy.yml"
      - ".github/workflows/messaging-gateway-preflight.yml"

concurrency:
  group: messaging-gateway-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install root dependencies
        run: bun install --frozen-lockfile --no-save && git diff --exit-code -- bun.lock

      - name: Test preflight CLI contract
        run: bun test packages/cloud/shared/scripts/messaging-gateway-preflight.test.mjs

      - name: Test gateway startup and request enforcement
        run: bun test packages/cloud/services/gateway-webhook/__tests__/internal-auth.test.ts
